name: Build CameraObscura IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2 (default runner Xcode is too old for current XcodeGen's project format)
        run: sudo xcode-select -s /Applications/Xcode_16.2.app && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild -project CameraObscura.xcodeproj \
            -scheme CameraObscura \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA (unsigned — sign locally with Sideloadly/SideStore)
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/CameraObscura.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CameraObscura-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraObscura-unsigned-ipa
          path: CameraObscura-unsigned.ipa
          retention-days: 30
