name: CameraObscura
options:
  bundleIdPrefix: com.danielschweiger
  deploymentTarget:
    iOS: "16.0"
targets:
  CameraObscura:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
    settings:
      base:
        # Without this, Xcode 16's default project format auto-generates Info.plist and
        # silently ignores `info.path` below — the app then ships with none of our privacy
        # usage descriptions and gets TCC-killed (SIGABRT) the instant it touches the camera.
        # Confirmed by unzipping a built .ipa: its Info.plist had zero of our custom keys.
        # MUST be quoted: bare `NO` is YAML's boolean false, which XcodeGen writes into the
        # pbxproj as something other than the literal string "NO" Xcode's build system checks
        # for — so the unquoted form silently has no effect (verified: still fully auto-generated
        # after adding it unquoted; CODE_SIGNING_ALLOWED: NO below "works" only because the CI
        # workflow also passes it as a command-line override, which this setting has no such
        # safety net for).
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.danielschweiger.cameraobscura
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/CameraObscura.entitlements
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: MetalKit.framework
      - sdk: Metal.framework
    # Belt-and-suspenders: `xcodebuild -showBuildSettings` confirms GENERATE_INFOPLIST_FILE=NO
    # and INFOPLIST_FILE=Sources/Info.plist are both correctly resolved, yet the packaged
    # Info.plist still comes out with none of our custom keys (verified twice by unzipping the
    # built .ipa) — an unresolved Xcode 16.2 / XcodeGen project-format quirk, not a config typo.
    # Patch the required keys into the already-built Info.plist directly so the app cannot ship
    # without them regardless of whatever the synthesis step does upstream.
    postBuildScripts:
      - name: Patch required Info.plist keys
        script: |
          set -e
          PLIST="$CODESIGNING_FOLDER_PATH/Info.plist"
          set_key() {
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
          }
          set_key CFBundleDisplayName "CameraObscura"
          set_key NSCameraUsageDescription "CameraObscura braucht die Kamera, um Fisheye-Fotos und -Videos aufzunehmen."
          set_key NSMicrophoneUsageDescription "CameraObscura braucht das Mikrofon, um Videos mit Ton aufzunehmen."
          set_key NSPhotoLibraryAddUsageDescription "CameraObscura speichert deine bearbeiteten Fotos und Videos in deiner Fotos-App."
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string instagram" "$PLIST"
          echo "Patched Info.plist:"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"
    # PhotoEditingExtension target temporarily removed: sideloading via the free/personal
    # signing tier consistently stalled at "Finished writing to device" (75%) whenever an
    # embedded app extension was present — the on-device installer never completed for the
    # combined bundle. Dropping the extension isolates the variable so the core camera app
    # can actually ship today; the extension's source is untouched under PhotoEditingExtension/
    # and Sources/LensLook.swift + FisheyeFilter.swift, ready to re-add to this file once
    # there's time to debug that specific failure properly (or once on a paid account, which
    # uses a completely different, non-fragile install path via TestFlight/Xcode).
