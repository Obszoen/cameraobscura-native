name: CameraObscura
options:
  bundleIdPrefix: com.danielschweiger
  deploymentTarget:
    iOS: "16.0"
targets:
  CameraObscura:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielschweiger.cameraobscura
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty on purpose (no applesignin key): the free/personal-team signing tier used
        # for sideloading cannot issue the com.apple.developer.applesignin entitlement at
        # all, and requesting it silently breaks the on-device install with no error
        # anywhere in the transfer log. But an entirely MISSING entitlements file breaks
        # AltServer-Linux's own signing step ("Error parsing entitlements") — so it needs
        # to exist and just be empty, not be absent. Add applesignin back here once on the
        # paid Apple Developer Program.
        CODE_SIGN_ENTITLEMENTS: Sources/CameraObscura.entitlements
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - target: PhotoEditingExtension
        embed: true

  PhotoEditingExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PhotoEditingExtension
      - path: Sources/LensLook.swift
      - path: Sources/FisheyeFilter.swift
    info:
      path: PhotoEditingExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielschweiger.cameraobscura.photoedit
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: PhotoEditingExtension/PhotoEditingExtension.entitlements
    dependencies:
      - sdk: CoreImage.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
